name: Publicar Vinicius Tutoriais Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps.json"
      - "icon.png"
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Conferir chave secreta
        shell: bash
        run: |
          if [ -z "${{ secrets.FDROID_SIGNING_BUNDLE_B64 }}" ]; then
            echo "::error::Secret FDROID_SIGNING_BUNDLE_B64 não encontrado."
            exit 1
          fi

      - name: Instalar ferramentas
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner default-jdk-headless python3-venv unzip jq
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install fdroidserver requests

      - name: Restaurar chave privada
        shell: bash
        run: |
          mkdir -p .fdroid-secrets
          printf '%s' "${{ secrets.FDROID_SIGNING_BUNDLE_B64 }}" | base64 -d > /tmp/fdroid-signing.zip
          unzip -q /tmp/fdroid-signing.zip -d .fdroid-secrets
          chmod 600 .fdroid-secrets/fdroid.keystore .fdroid-secrets/secret.env

      - name: Criar configuração do repositório
        shell: bash
        run: |
          set -a
          source .fdroid-secrets/secret.env
          set +a

          cat > config.yml <<'EOF'
          repo_url: "https://viniciustutors.github.io/vinicius-tutoriais-apps/fdroid/repo"
          repo_name: "Vinicius Tutoriais Apps"
          repo_icon: "icon.png"
          repo_description: "Aplicativos e emuladores selecionados e indicados pelo canal Vinicius Tutoriais. Os APKs são cópias intactas obtidas das releases oficiais dos respectivos desenvolvedores."
          archive_older: 0
          nonstandardwebroot: true
          mirrors:
            - "https://github.com/viniciustutors/vinicius-tutoriais-apps/releases/download"
          keystore: ".fdroid-secrets/fdroid.keystore"
          repo_keyalias: "__KEY_ALIAS__"
          keystorepass: "__KEYSTORE_PASS__"
          keypass: "__KEYSTORE_PASS__"
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("config.yml")
          s = p.read_text()
          s = s.replace("__KEY_ALIAS__", os.environ["FDROID_KEY_ALIAS"])
          s = s.replace("__KEYSTORE_PASS__", os.environ["FDROID_KEYSTORE_PASS"])
          p.write_text(s)
          PY

      - name: Buscar APKs oficiais
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf repo metadata
          mkdir -p repo metadata repo/icons
          cp icon.png repo/icons/icon.png

          . .venv/bin/activate
          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse, quote
          import requests

          apps = json.loads(Path("apps.json").read_text(encoding="utf-8"))
          outdir = Path("repo")
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "Vinicius-Tutoriais-Apps",
          }
          token = os.environ.get("GH_TOKEN")
          if token:
              headers["Authorization"] = f"Bearer {token}"

          session = requests.Session()
          session.headers.update(headers)

          def release_for(owner, project, app):
              if app.get("release_tag"):
                  tag = quote(str(app["release_tag"]), safe="")
                  url = f"https://api.github.com/repos/{owner}/{project}/releases/tags/{tag}"
                  r = session.get(url, timeout=30)
                  r.raise_for_status()
                  return r.json()

              if app.get("include_prerelease"):
                  url = f"https://api.github.com/repos/{owner}/{project}/releases?per_page=100"
                  r = session.get(url, timeout=30)
                  r.raise_for_status()
                  releases = [x for x in r.json() if not x.get("draft")]
                  if not releases:
                      raise RuntimeError(f"{owner}/{project}: nenhuma release publicada.")
                  releases.sort(
                      key=lambda x: x.get("published_at") or x.get("created_at") or "",
                      reverse=True
                  )
                  return releases[0]

              url = f"https://api.github.com/repos/{owner}/{project}/releases/latest"
              r = session.get(url, timeout=30)
              r.raise_for_status()
              return r.json()

          for app in apps:
              if app.get("enabled", True) is False:
                  print(f"[{app.get('name','?')}] desativado; ignorando.")
                  continue

              name = app["name"]
              source = app["source"]
              pattern = re.compile(app.get("asset_regex", r"\.apk$"), re.I)

              parsed = urlparse(source)
              if parsed.netloc.lower() != "github.com":
                  raise SystemExit(f"{name}: nesta versão, 'source' precisa ser um repositório GitHub.")

              parts = [p for p in parsed.path.strip("/").split("/") if p]
              if len(parts) < 2:
                  raise SystemExit(f"{name}: link GitHub inválido: {source}")

              owner, project = parts[:2]
              release = release_for(owner, project, app)

              print(
                  f"\n[{name}] release {release.get('tag_name')} "
                  f"({'pre-release' if release.get('prerelease') else 'estável'})"
              )

              matches = [
                  asset for asset in release.get("assets", [])
                  if pattern.search(asset.get("name", ""))
              ]

              if not matches:
                  names = ", ".join(a.get("name", "") for a in release.get("assets", []))
                  raise SystemExit(
                      f"{name}: nenhum APK corresponde a {pattern.pattern!r}. "
                      f"Arquivos disponíveis: {names}"
                  )

              matches.sort(
                  key=lambda a: (
                      "universal" not in a["name"].lower(),
                      "arm64" not in a["name"].lower(),
                      a["name"].lower(),
                  )
              )
              asset = matches[0]

              safe = re.sub(r"[^A-Za-z0-9._-]+", "-", name).strip("-")
              filename = f"{safe}__{asset['name']}"
              dest = outdir / filename

              print(f"[{name}] usando {asset['name']} -> {filename}")

              with session.get(
                  asset["browser_download_url"],
                  stream=True,
                  timeout=300,
                  allow_redirects=True,
              ) as resp:
                  resp.raise_for_status()
                  with dest.open("wb") as f:
                      for chunk in resp.iter_content(chunk_size=1024 * 1024):
                          if chunk:
                              f.write(chunk)

              print(f"[{name}] OK - {dest.stat().st_size / 1024 / 1024:.1f} MB")
          PY

      - name: Gerar índice F-Droid assinado
        shell: bash
        run: |
          . .venv/bin/activate
          fdroid update --create-metadata
          fdroid update

      - name: Garantir Release usada como espelho de APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view repo >/dev/null 2>&1; then
            gh release create repo               --title "Vinicius Tutoriais Apps - APK Mirror"               --notes "Espelho automático dos APKs listados no repositório F-Droid."
          fi

      - name: Sincronizar APKs com GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/repo" --jq '.id')"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > /tmp/assets-before.json
          : > /tmp/current-assets.txt

          for file in repo/*.apk; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            echo "$name" >> /tmp/current-assets.txt

            local_digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            asset_id="$(jq -r --arg n "$name" '.[] | select(.name==$n) | .id' /tmp/assets-before.json | head -n1)"
            remote_digest="$(jq -r --arg n "$name" '.[] | select(.name==$n) | (.digest // "")' /tmp/assets-before.json | head -n1)"

            if [ -n "$asset_id" ] && [ "$remote_digest" = "$local_digest" ]; then
              echo "Sem mudança: $name"
              continue
            fi

            if [ -n "$asset_id" ]; then
              echo "Substituindo: $name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            else
              echo "Enviando: $name"
            fi

            gh release upload repo "$file"
          done

      - name: Montar GitHub Pages sem APKs grandes
        shell: bash
        run: |
          rm -rf site
          mkdir -p site/fdroid
          cp -a repo site/fdroid/repo
          find site/fdroid/repo -maxdepth 1 -type f -name '*.apk' -delete

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Vinicius Tutoriais Apps</title>
          <body style="font-family:system-ui;max-width:760px;margin:60px auto;padding:0 20px">
            <h1>Vinicius Tutoriais Apps</h1>
            <p>Aplicativos e emuladores recomendados pelo canal Vinicius Tutoriais.</p>
            <p><strong>URL para adicionar no F-Droid Basic:</strong></p>
            <code>https://viniciustutors.github.io/vinicius-tutoriais-apps/fdroid/repo</code>
          </body>
          </html>
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remover APKs antigos do espelho
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/repo" --jq '.id')"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > /tmp/assets-after.json

          while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_name" ] || continue
            if ! grep -Fxq "$asset_name" /tmp/current-assets.txt; then
              echo "Removendo APK antigo: $asset_name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < <(jq -r '.[] | [.id, .name] | @tsv' /tmp/assets-after.json)
