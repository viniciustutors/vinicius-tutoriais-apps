name: Publicar Vinicius Tutoriais Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps.json"
      - "icon.png"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Conferir chave secreta
        shell: bash
        run: |
          if [ -z "${{ secrets.FDROID_SIGNING_BUNDLE_B64 }}" ]; then
            echo "::error::Secret FDROID_SIGNING_BUNDLE_B64 não encontrado."
            exit 1
          fi

      - name: Instalar ferramentas
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner default-jdk-headless python3-venv unzip jq fonts-dejavu-core
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install fdroidserver requests PyYAML Pillow

      - name: Restaurar chave privada
        shell: bash
        run: |
          mkdir -p .fdroid-secrets
          printf '%s' "${{ secrets.FDROID_SIGNING_BUNDLE_B64 }}" | base64 -d > /tmp/fdroid-signing.zip
          unzip -q /tmp/fdroid-signing.zip -d .fdroid-secrets
          chmod 600 .fdroid-secrets/fdroid.keystore .fdroid-secrets/secret.env

      - name: Criar configuração F-Droid
        shell: bash
        run: |
          set -a
          source .fdroid-secrets/secret.env
          set +a

          cat > config.yml <<'EOF'
          repo_url: "https://viniciustutors.github.io/vinicius-tutoriais-apps/fdroid/repo"
          repo_name: "Vinicius Tutoriais Apps"
          repo_icon: "icon.png"
          repo_description: "Aplicativos e emuladores selecionados e indicados pelo canal Vinicius Tutoriais. Versões, descrições, ícones e informações técnicas são atualizados automaticamente a partir das fontes oficiais."
          archive_older: 0
          nonstandardwebroot: true
          mirrors:
            - "https://github.com/viniciustutors/vinicius-tutoriais-apps/releases/download"
          keystore: ".fdroid-secrets/fdroid.keystore"
          repo_keyalias: "__KEY_ALIAS__"
          keystorepass: "__KEYSTORE_PASS__"
          keypass: "__KEYSTORE_PASS__"
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("config.yml")
          s = p.read_text()
          s = s.replace("__KEY_ALIAS__", os.environ["FDROID_KEY_ALIAS"])
          s = s.replace("__KEYSTORE_PASS__", os.environ["FDROID_KEYSTORE_PASS"])
          p.write_text(s)
          PY
          chmod 600 config.yml

      - name: Buscar APKs e gerar metadados automaticamente
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf repo metadata build-state.json
          mkdir -p repo metadata repo/icons
          cp icon.png repo/icons/icon.png
          . .venv/bin/activate
          python scripts/build_repo.py

      - name: Gerar índice F-Droid assinado
        shell: bash
        run: |
          . .venv/bin/activate
          fdroid update

      - name: Garantir Release usada como espelho de APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view repo >/dev/null 2>&1; then
            gh release create repo \
              --title "Vinicius Tutoriais Apps - APK Mirror" \
              --notes "Espelho automático dos APKs publicados pelo repositório F-Droid."
          fi

      - name: Sincronizar APKs com GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/repo" --jq '.id')"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > /tmp/assets-before.json
          : > /tmp/current-assets.txt

          for file in repo/*.apk; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            echo "$name" >> /tmp/current-assets.txt

            local_digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            asset_id="$(jq -r --arg n "$name" '.[] | select(.name==$n) | .id' /tmp/assets-before.json | head -n1)"
            remote_digest="$(jq -r --arg n "$name" '.[] | select(.name==$n) | (.digest // "")' /tmp/assets-before.json | head -n1)"

            if [ -n "$asset_id" ] && [ "$remote_digest" = "$local_digest" ]; then
              echo "Sem mudança: $name"
              continue
            fi

            if [ -n "$asset_id" ]; then
              echo "Substituindo: $name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            else
              echo "Enviando: $name"
            fi

            gh release upload repo "$file"
          done

      - name: Montar GitHub Pages sem APKs grandes
        shell: bash
        run: |
          rm -rf site
          mkdir -p site/fdroid
          cp -a repo site/fdroid/repo
          find site/fdroid/repo -maxdepth 1 -type f -name '*.apk' -delete
          cp build-state.json site/build-state.json

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Vinicius Tutoriais Apps</title>
          <body style="font-family:system-ui;max-width:760px;margin:60px auto;padding:0 20px">
            <h1>Vinicius Tutoriais Apps</h1>
            <p>Aplicativos e emuladores recomendados pelo canal Vinicius Tutoriais.</p>
            <p>Versões, descrições, ícones e dados técnicos são atualizados automaticamente.</p>
            <p><strong>URL para adicionar no F-Droid Basic:</strong></p>
            <code>https://viniciustutors.github.io/vinicius-tutoriais-apps/fdroid/repo</code>
          </body>
          </html>
          EOF

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Remover APKs antigos do espelho
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/repo" --jq '.id')"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" > /tmp/assets-after.json

          while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_name" ] || continue
            if ! grep -Fxq "$asset_name" /tmp/current-assets.txt; then
              echo "Removendo APK antigo: $asset_name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < <(jq -r '.[] | [.id, .name] | @tsv' /tmp/assets-after.json)
